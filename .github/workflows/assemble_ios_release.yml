# iOS Debug IPA 自动打包工作流
# 手动触发，使用自动签名
name: Build iOS Debug IPA

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明"
        required: false

env:
  NODE_VERSION: "22"
  APP_NAME: "ApexFinance"
  SHELL_REPO: "NervJS/taro-native-shell"
  SHELL_BRANCH: "0.73.0"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@8

      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      - name: Build JS bundle
        run: pnpm run build:rn -- --platform ios

      - name: Clone shell
        run: |
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} \
            https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Copy bundle
        run: |
          SHELL_DIR=../taro-native-shell/ios
          cp dist/index.bundle $SHELL_DIR/main.jsbundle

      - name: Install CocoaPods
        working-directory: ../taro-native-shell/ios
        run: |
          gem install cocoapods
          pod install --verbose

      - name: Build Debug IPA
        working-directory: ../taro-native-shell/ios
        run: |
          SCHEME="taroDemo"
          TEAM_ID="${{ secrets.IOS_TEAM_ID }}"

          # 归档
          xcodebuild -workspace ${SCHEME}.xcworkspace \
            -scheme $SCHEME \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath build/${SCHEME}.xcarchive \
            clean archive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=$TEAM_ID

          # 导出配置
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF

          # 导出 IPA
          xcodebuild -exportArchive \
            -archivePath build/${SCHEME}.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-IPA
          path: ../taro-native-shell/ios/build/output/*.ipa
          retention-days: 30
