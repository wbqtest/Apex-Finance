# Android Debug APK 自动打包工作流
name: Assemble Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明"
        required: false
        default: "自动构建的 APK 版本"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_NAME: "ApexFinance"
  # 使用官方新仓库和正确分支
  SHELL_REPO: "NervJS/taro-project-templates"
  SHELL_BRANCH: "v4.2-RN-0.73"

jobs:
  assemble:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ========== 1. 环境准备 ==========
      - name: Checkout JS 工程代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # ========== 2. 缓存 ==========
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-v1-
            ${{ runner.os }}-gradle-

      # ========== 3. 安装 JS 依赖 ==========
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ========== 4. 准备壳工程 ==========
      - name: Clone Taro Native Shell
        run: |
          rm -rf ../taro-native-shell
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Configure shell project
        working-directory: ../taro-native-shell
        run: |
          # 修改应用名
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/assets

          # 注释 RN 自带打包脚本
          sed -i 's|^apply from: "../../node_modules/react-native/react.gradle"|// apply from: "../../node_modules/react-native/react.gradle"|' android/app/build.gradle

          # 安装壳工程依赖
          npm install || true

      # ========== 5. 构建 JS Bundle ==========
      - name: Build JS bundle for Android
        run: pnpm run build:rn -- --platform android

      # ========== 6. 修复仓库源 ==========
      - name: Fix repository for Gradle
        working-directory: ../taro-native-shell/android
        run: |
          cp build.gradle build.gradle.bak
          sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|jcenter()|mavenCentral()|g' build.gradle

          if [ -f settings.gradle ]; then
            sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' settings.gradle
            sed -i 's|jcenter()|mavenCentral()|g' settings.gradle
          fi

      # ========== 7. 修复 expo 模块 ==========
      - name: Fix expo module issues
        working-directory: ../taro-native-shell
        run: |
          echo "📦 修复 expo 模块兼容问题..."

          # 在 build.gradle 中定义 kotlinVersion
          cd android
          if ! grep -q "kotlinVersion" build.gradle; then
            cat > build.gradle.tmp << 'GRADLEEOF'
          ext { kotlinVersion = '1.9.23' }

          GRADLEEOF
            cat build.gradle >> build.gradle.tmp
            mv build.gradle.tmp build.gradle
          fi
          cd ..

          # 精确修复 expo 模块
          find node_modules -path '*/expo/*' -name 'build.gradle' | while read f; do
            sed -i 's/kotlinVersion()/kotlinVersion/g' "$f" 2>/dev/null || true
          done

      # ========== 8. 打包 Debug APK ==========
      - name: Build Debug APK
        working-directory: ../taro-native-shell/android
        run: |
          printf '\n' >> gradle.properties
          cat >> gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          PROPS

          chmod +x gradlew

          # init.gradle 注入 kotlinVersion
          cat > /tmp/init.gradle << 'INIT'
          gradle.projectsLoaded { g ->
            g.rootProject.ext.kotlinVersion = "1.9.23"
          }
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('kotlinVersion')) {
                project.ext.kotlinVersion = "1.9.23"
              }
            }
          }
          INIT

          set -o pipefail
          ./gradlew assembleDebug -I /tmp/init.gradle --stacktrace 2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo ""
            echo "========== 构建失败，最后 150 行日志 =========="
            tail -150 /tmp/gradle.log
            echo "========== 错误详情 =========="
            grep -E '^(e:|w:)' /tmp/gradle.log | head -80 || true
            exit $GRADLE_EXIT
          fi

      # ========== 9. 上传 APK ==========
      - name: Copy APK to workspace
        run: |
          mkdir -p artifacts
          APK_PATH="../taro-native-shell/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" artifacts/
            echo "✅ APK 已复制到 artifacts/"
            ls -lh artifacts/
          else
            echo "❌ APK 不存在: $APK_PATH"
            echo "查找所有 APK 文件..."
            find ../taro-native-shell -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: artifacts/app-debug.apk
          retention-days: 30
