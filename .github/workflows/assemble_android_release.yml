# Android Debug APK 自动打包工作流
# 手动触发生成 Debug APK，用于验证流程完整性
name: Assemble Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明"
        required: false
        default: "自动构建的 APK 版本"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_NAME: "ApexFinance"
  SHELL_REPO: "NervJS/taro-native-shell"
  SHELL_BRANCH: "0.73.0"

jobs:
  assemble:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ========== 1. 环境准备 ==========
      - name: Checkout JS 工程代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      # ========== 2. 构建 JS Bundle ==========
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS bundle for Android
        run: pnpm run build:rn -- --platform android

      # ========== 3. 准备壳工程 ==========
      - name: Clone Taro Native Shell
        run: |
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Copy bundle and assets to shell
        run: |
          SHELL_DIR=../taro-native-shell
          ANDROID_ASSETS=$SHELL_DIR/android/app/src/main/assets
          ANDROID_RES=$SHELL_DIR/android/app/src/main/res

          # 复制 JS bundle
          mkdir -p $ANDROID_ASSETS
          cp dist/index.bundle $ANDROID_ASSETS/index.android.bundle

          # 复制资源文件 (drawable-* 目录)
          if ls dist/drawable-* 1> /dev/null 2>&1; then
            for dir in dist/drawable-*; do
              dirname=$(basename "$dir")
              rm -rf $ANDROID_RES/$dirname
              cp -r "$dir" $ANDROID_RES/$dirname
            done
          fi

          # 复制 raw 资源
          if [ -d dist/raw ]; then
            rm -rf $ANDROID_RES/raw
            cp -r dist/raw $ANDROID_RES/raw
          fi

      # ========== 4. 配置壳工程 ==========
      - name: Configure shell project
        working-directory: ../taro-native-shell
        run: |
          # 修改应用名
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml || true

          # 创建 assets 目录
          mkdir -p android/app/src/main/assets

          # 安装壳工程依赖 (RN 0.73, 无 jcenter 遗留问题)
          npm install || true

      # ========== 5. 修复仓库源 ==========
      - name: Fix repository for Gradle
        working-directory: ../taro-native-shell/android
        run: |
          # 备份原文件
          cp build.gradle build.gradle.bak

          # 将阿里云镜像替换为 Google
          sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/nexus/content/groups/public|https://repo1.maven.org/maven2|g' build.gradle

          # 如果还有 jcenter，也替换掉
          sed -i 's|jcenter()|mavenCentral()|g' build.gradle

          # 对 settings.gradle 也做同样处理（如有）
          if [ -f settings.gradle ]; then
            sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' settings.gradle
            sed -i 's|jcenter()|mavenCentral()|g' settings.gradle
          fi

          echo "=== 修改后的 build.gradle (前30行) ==="
          head -30 build.gradle

      # ========== 5.5. 修复 expo 模块依赖 ==========
      - name: Fix expo module build
        working-directory: ../taro-native-shell/android
        run: |
          # 在 build.gradle 最顶部注入 ext.kotlinVersion (expo 读 rootProject.ext)
          sed -i '1i\ext.kotlinVersion = "1.9.22"' build.gradle
          echo "=== build.gradle 前 8 行 ==="
          head -8 build.gradle

      # ========== 6. 打包 Debug APK ==========
      - name: Build Debug APK
        working-directory: ../taro-native-shell/android
        run: |
          # 设置 Gradle 属性 (RN 0.73 使用 AGP 8.x, JDK 17 原生兼容)
          cat >> gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlinVersion=1.9.22
          kotlin.jvm.target.validation.mode=warning
          PROPS

          chmod +x gradlew

          # 创建 init 脚本双保险：确保所有 project 的 ext 都带有 kotlinVersion
          cat > /tmp/init.gradle << 'INIT'
          allprojects { p ->
            p.ext.kotlinVersion = "1.9.22"
          }
          INIT

          # 捕获完整构建日志，失败时打印 Kotlin 具体编译错误
          set -o pipefail
          ./gradlew assembleDebug -I /tmp/init.gradle --stacktrace 2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo ""
            echo "========== Kotlin 编译错误详情 =========="
            grep -E '^(e:|w:)' /tmp/gradle.log | head -50 || true
            echo "==========================================="
            exit $GRADLE_EXIT
          fi

      # ========== 7. 上传 APK ==========
      - name: Copy APK to workspace
        run: |
          mkdir -p artifacts
          cp ../taro-native-shell/android/app/build/outputs/apk/debug/app-debug.apk artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: artifacts/app-debug.apk
          retention-days: 30
