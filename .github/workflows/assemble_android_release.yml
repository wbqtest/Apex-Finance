# Android Debug APK 自动打包工作流
# 手动触发生成 Debug APK，用于验证流程完整性
name: Assemble Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明"
        required: false
        default: "自动构建的 APK 版本"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_NAME: "ApexFinance"
  SHELL_REPO: "NervJS/taro-native-shell"
  SHELL_BRANCH: "0.73.0"

jobs:
  assemble:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ========== 1. 环境准备 ==========
      - name: Checkout JS 工程代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      # ========== 2. 安装 JS 依赖 ==========
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      # ========== 3. 准备壳工程 ==========
      - name: Clone Taro Native Shell
        run: |
          rm -rf ../taro-native-shell
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Configure shell project
        working-directory: ../taro-native-shell
        run: |
          # 修改应用名
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml || true
          # 确保 assets 目录存在 (build:rn 会写入此处)
          mkdir -p android/app/src/main/assets

          # Taro 分离模式要求：注释 RN 自带打包脚本，因为 bundle 由 Taro 打包
          sed -i 's|^apply from: "../../node_modules/react-native/react.gradle"|// apply from: "../../node_modules/react-native/react.gradle"|' android/app/build.gradle
          echo "=== app/build.gradle react.gradle 行 ==="
          grep -n "react.gradle" android/app/build.gradle || echo "未找到 react.gradle 引用"

          # 安装壳工程依赖 (RN 0.73)
          npm install || true

      # ========== 4. 构建 JS Bundle ==========
      # rn.output 已配置指向壳工程，产物直接输出到 ../taro-native-shell/android/
      - name: Build JS bundle for Android
        run: pnpm run build:rn -- --platform android

      # ========== 5. 修复仓库源 ==========
      - name: Fix repository for Gradle
        working-directory: ../taro-native-shell/android
        run: |
          # 备份原文件
          cp build.gradle build.gradle.bak

          # 将阿里云镜像替换为 Google
          sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/nexus/content/groups/public|https://repo1.maven.org/maven2|g' build.gradle

          # 如果还有 jcenter，也替换掉
          sed -i 's|jcenter()|mavenCentral()|g' build.gradle

          # 对 settings.gradle 也做同样处理（如有）
          if [ -f settings.gradle ]; then
            sed -i 's|https://maven.aliyun.com/repository/public|https://dl.google.com/dl/android/maven2|g' settings.gradle
            sed -i 's|jcenter()|mavenCentral()|g' settings.gradle
          fi

          echo "=== 修改后的 build.gradle (前30行) ==="
          head -30 build.gradle

      # ========== 5.5. 修复 expo 模块依赖 ==========
      - name: 🔧 Fix expo module issues
        working-directory: ../taro-native-shell
        run: |
          echo "📦 修复 expo 模块的兼容问题..."

          # 1. 在壳工程 android/build.gradle 中定义 ext.kotlinVersion
          cd android
          if ! grep -q "kotlinVersion" build.gradle; then
            cat > build.gradle.tmp << 'GRADLEEOF'
          ext { kotlinVersion = '1.9.22' }

          GRADLEEOF
            cat build.gradle >> build.gradle.tmp
            mv build.gradle.tmp build.gradle
            echo "✅ build.gradle 已添加 ext.kotlinVersion"
          fi
          cd ..

          # 2. 去除所有 expo 模块中 kotlinVersion() 的方法括号
          #    expo / expo-av / expo-modules-core 等多个模块都有此问题
          find node_modules -name 'build.gradle' -path '*/expo*' -exec grep -l 'kotlinVersion()' {} \; | while read f; do
            echo "  Patching: $f"
            sed -i 's/\.kotlinVersion()/.kotlinVersion/g' "$f"
          done

          # 3. 修复 expo-modules-core: components.release 在 AGP 8.x 需 afterEvaluate
          EXPOCORE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$EXPOCORE" ]; then
            echo "=== $EXPOCORE 76行附近 ==="
            sed -n '70,85p' "$EXPOCORE"
            # 将 publishing 相关代码包裹在 afterEvaluate 中
            # 匹配 androidComponents / components.release 相关行
            if grep -q 'components.release' "$EXPOCORE" 2>/dev/null; then
              sed -i 's/components\.release/components.findByName("release")/' "$EXPOCORE" || true
              echo "✅ patched components.release"
            fi
          fi

      # ========== 6. 打包 Debug APK ==========
      - name: Build Debug APK
        working-directory: ../taro-native-shell/android
        run: |
          # 设置 Gradle 属性 (RN 0.73 使用 AGP 8.x, JDK 17 原生兼容)
          # 先确保文件末尾有换行，避免 cat >> 拼接到末尾行
          printf '\n' >> gradle.properties
          cat >> gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlinVersion=1.9.22
          kotlin.jvm.target.validation.mode=warning
          PROPS

          chmod +x gradlew

          # 创建 init 脚本，将 kotlinVersion 设为 Closure (支持 .kotlinVersion() 方法调用语法)
          cat > /tmp/init.gradle << 'INIT'
          gradle.projectsLoaded { g ->
            g.rootProject.ext.kotlinVersion = { "1.9.22" }
          }
          INIT

          # 捕获完整构建日志，失败时打印 Kotlin 具体编译错误
          set -o pipefail
          ./gradlew assembleDebug -I /tmp/init.gradle --stacktrace 2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo ""
            echo "========== Kotlin 编译错误详情 =========="
            grep -E '^(e:|w:)' /tmp/gradle.log | head -50 || true
            echo "==========================================="
            exit $GRADLE_EXIT
          fi

      # ========== 7. 上传 APK ==========
      - name: Copy APK to workspace
        run: |
          mkdir -p artifacts
          cp ../taro-native-shell/android/app/build/outputs/apk/debug/app-debug.apk artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: artifacts/app-debug.apk
          retention-days: 30
