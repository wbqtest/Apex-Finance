# Android APK 自动打包工作流
# 触发条件：推送到 main 分支或手动触发
name: Assemble Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明"
        required: false
        default: "自动构建的 APK 版本"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_NAME: "ApexFinance"
  SHELL_REPO: "NervJS/taro-native-shell"
  SHELL_BRANCH: "master"

jobs:
  assemble:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ========== 1. 环境准备 ==========
      - name: Checkout JS 工程代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      # ========== 2. 构建 JS Bundle ==========
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS bundle for Android
        run: pnpm run build:rn -- --platform android

      # ========== 3. 准备壳工程 ==========
      - name: Clone Taro Native Shell
        run: |
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Copy bundle and assets to shell
        run: |
          SHELL_DIR=../taro-native-shell
          ANDROID_ASSETS=$SHELL_DIR/android/app/src/main/assets
          ANDROID_RES=$SHELL_DIR/android/app/src/main/res

          # 复制 JS bundle
          mkdir -p $ANDROID_ASSETS
          cp dist/index.bundle $ANDROID_ASSETS/index.android.bundle

          # 复制资源文件 (drawable-* 目录)
          if ls dist/drawable-* 1> /dev/null 2>&1; then
            for dir in dist/drawable-*; do
              dirname=$(basename "$dir")
              rm -rf $ANDROID_RES/$dirname
              cp -r "$dir" $ANDROID_RES/$dirname
            done
          fi

          # 复制 raw 资源
          if [ -d dist/raw ]; then
            rm -rf $ANDROID_RES/raw
            cp -r dist/raw $ANDROID_RES/raw
          fi

      # ========== 4. 配置壳工程 ==========
      - name: Configure shell project
        working-directory: ../taro-native-shell
        run: |
          # 修改应用名
          sed -i "s/android:label=\"taroDemo\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml || true

          # 创建 assets 目录
          mkdir -p android/app/src/main/assets

          # === 修复 jcenter 关停问题：添加 mavenCentral() + jitpack 仓库 ===
          # Google 已将 ExoPlayer 等库从 jcenter 迁移到 Maven Central
          sed -i '/google()/a\        mavenCentral()' android/build.gradle || true
          # android-image-cropper 的继任者 CanHub fork 托管在 jitpack
          sed -i '/mavenCentral()/a\        maven { url "https://jitpack.io" }' android/build.gradle || true

          # 安装壳工程依赖（会拉取 expo-av 等模块到 node_modules）
          npm install || true

      # ========== 5. 生成签名密钥 ==========
      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -keystore $HOME/.android/debug.keystore \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"

      # ========== 6. 打包 APK ==========
      - name: Build Release APK
        working-directory: ../taro-native-shell/android
        run: |
          # 设置 Gradle 属性
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          # JDK 17+ 兼容：开放 Gradle 4.x 内部 JAXB 反射所需的模块
          echo 'org.gradle.jvmargs=-Dfile.encoding=UTF-8 --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.prefs/java.util.prefs=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED' >> gradle.properties

          # === 修复 jcenter 关停导致的依赖缺失 ===
          # expo-av 的旧版依赖 (ExoPlayer 2.9.2, android-scalablevideoview) 已从 jcenter 下线
          # 在 expo-av 模块中：升级 ExoPlayer 版本，替换不可用的 scalabvideoview
          EXPO_AV_DIR=../node_modules/expo-av/android
          if [ -f "$EXPO_AV_DIR/build.gradle" ]; then
            echo ">>> Fixing expo-av dependencies..."
            # ExoPlayer 从 2.9.x 升级到 2.18.x（Maven Central 可用）
            sed -i 's/com\.google\.android\.exoplayer:exoplayer:[0-9.]\+/com.google.android.exoplayer:exoplayer:2.18.5/g' "$EXPO_AV_DIR/build.gradle"
            sed -i 's/com\.google\.android\.exoplayer:extension-okhttp:[0-9.]\+/com.google.android.exoplayer:extension-okhttp:2.18.5/g' "$EXPO_AV_DIR/build.gradle"
            # android-scalablevideoview 1.0.1 已从 jcenter 消失，新版 expo-av 不再需要
            sed -i '/com\.yqritc:android-scalablevideoview/d' "$EXPO_AV_DIR/build.gradle"
            # 新版 ExoPlayer (2.18.x) 的 API 有 Breaking Change，修复导入路径
            find ../node_modules/expo-av -name "*.java" -exec sed -i 's/com\.google\.android\.exoplayer2\.util\.Util/com.google.android.exoplayer2.util.Util/g' {} \; || true
          fi

          # expo-image-picker 依赖的 android-image-cropper 2.7.0 已从 jcenter 下线
          # 替换为 CanHub 维护的 API 兼容版本（通过 jitpack 发布）
          EXPO_IMAGE_PICKER_DIR=../node_modules/expo-image-picker/android
          if [ -f "$EXPO_IMAGE_PICKER_DIR/build.gradle" ]; then
            echo ">>> Fixing expo-image-picker dependencies..."
            sed -i 's/com\.theartofdev\.edmodo:android-image-cropper:[0-9.]\+/com.github.CanHub:Android-Image-Cropper:2.8.0/g' "$EXPO_IMAGE_PICKER_DIR/build.gradle"
          fi

          # NDK 目录结构与 AGP 3.x 不兼容，且本项目不需要 NDK；清除环境变量消除警告
          unset ANDROID_NDK_HOME

          # 执行打包
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.key.alias=androiddebugkey \
            -Pandroid.injected.key.password=android \
            --stacktrace

      # ========== 7. 上传 APK ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: ../taro-native-shell/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            ## ${{ github.event.tag_name }}

            ${{ github.event.inputs.release_notes || '自动构建版本' }}

            ### 下载 APK
            请查看 Artifacts 中的 `${{ env.APP_NAME }}-APK` 下载安装包。

            ### 版本信息
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
