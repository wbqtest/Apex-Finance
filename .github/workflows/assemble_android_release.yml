# Android Release APK 自动打包工作流
# 移植自 wuba/taro-playground 的 assemble_android_release.yml，适配 Apex-Finance：
#   - 使用 pnpm（原为 yarn）
#   - 复用本项目的 taro-native-shell 壳工程方案（原为仓库内 android/ 原生目录 + fastlane）
#   - 通过 GitHub Secrets 注入签名信息，产物上传 GitHub Release

name: Assemble Android Release

on:
  push:
    tags: [ 'v*', 'r*', 'a*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名称 (versionName)"
        required: false
        default: "1.0.0"
      version_code:
        description: "版本号 (versionCode)"
        required: false
        default: "100000"
      release_notes:
        description: "发布说明"
        required: false
        default: "自动构建的 Release APK 版本"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_NAME: "ApexFinance"
  SHELL_REPO: "NervJS/taro-native-shell"
  SHELL_BRANCH: "0.73.0"

jobs:
  assemble:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ========== 1. 环境准备 ==========
      - name: Checkout JS 工程代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: npm install -g pnpm@11

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # ========== 2. 缓存 ==========
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          # 基于 pnpm-lock.yaml 做 key，避免每个 commit 的 sha 导致缓存永不命中
          key: ${{ runner.os }}-gradle-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v1-

      # ========== 3. 安装 JS 依赖 ==========
      - name: Install JS dependencies
        # frozen-lockfile 保证 CI 构建可复现，lockfile 过期时显式报错
        run: pnpm install --frozen-lockfile

      # ========== 4. 准备壳工程 ==========
      - name: Clone Taro Native Shell
        run: |
          rm -rf ../taro-native-shell
          git clone --depth 1 --branch ${{ env.SHELL_BRANCH }} https://github.com/${{ env.SHELL_REPO }}.git ../taro-native-shell

      - name: Configure shell project
        working-directory: ../taro-native-shell
        run: |
          # 修改应用名
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APP_NAME }}\"/" android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/assets

          # 注释 RN 自带打包脚本
          sed -i 's|^apply from: "../../node_modules/react-native/react.gradle"|// apply from: "../../node_modules/react-native/react.gradle"|' android/app/build.gradle

          # 安装壳工程依赖
          npm install || true

      # ========== 5. 构建 JS Bundle ==========
      - name: Build JS bundle for Android
        run: pnpm run build:rn -- --platform android

      # ========== 6. 修复仓库源 ==========
      - name: Fix repository for Gradle
        working-directory: ../taro-native-shell/android
        run: |
          cp build.gradle build.gradle.bak
          # GitHub runner 无法访问阿里云镜像，全部替换为官方源
          sed -i 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' build.gradle
          sed -i 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' build.gradle
          sed -i 's|jcenter()|mavenCentral()|g' build.gradle

          if [ -f settings.gradle ]; then
            sed -i 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' settings.gradle
            sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' settings.gradle
            sed -i 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' settings.gradle
            sed -i 's|jcenter()|mavenCentral()|g' settings.gradle
          fi

      # ========== 7. 修复 expo 模块 ==========
      - name: Fix expo module issues
        working-directory: ../taro-native-shell
        run: |
          echo "📦 修复 expo 模块兼容问题..."

          # 在 build.gradle 中定义 kotlinVersion
          cd android
          if ! grep -q "kotlinVersion" build.gradle; then
            cat > build.gradle.tmp << 'GRADLEEOF'
          ext { kotlinVersion = '1.9.23' }

          GRADLEEOF
            cat build.gradle >> build.gradle.tmp
            mv build.gradle.tmp build.gradle
          fi
          cd ..

          # 精确修复 expo 模块
          find node_modules -path '*/expo/*' -name 'build.gradle' | while read f; do
            sed -i 's/kotlinVersion()/kotlinVersion/g' "$f" 2>/dev/null || true
          done

          # 更新 react-native-screens 到 Kotlin 1.9 兼容版本
          echo "📦 Updating react-native-screens..."
          npm install react-native-screens@3.29.0

          # 清理 Kotlin 编译缓存
          rm -rf android/.gradle

      # ========== 8. 配置 Release 签名 ==========
      - name: Configure Release Signing
        working-directory: ../taro-native-shell/android
        run: |
          # 解码签名密钥库（GitHub Secrets: ANDROID_KEYSTORE_BASE64）
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "❌ 缺少 Secrets.ANDROID_KEYSTORE_BASE64，请先在 GitHub 仓库配置 Secrets"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          ls -lh app/release.keystore

          # RN 模板默认 release 使用 debug 签名，这里移除 release 块的 debug 引用，
          # 改由 Gradle 注入属性 android.injected.signing.* 完成签名（与 fastlane 方式一致）
          awk '
            /buildTypes[[:space:]]*\{/ { in_bt = 1 }
            in_bt && /release[[:space:]]*\{/ { in_rel = 1 }
            in_rel && /^[[:space:]]*\}/ { in_rel = 0 }
            !(in_rel && /signingConfig signingConfigs\.debug/) { print }
          ' app/build.gradle > app/build.gradle.tmp && mv app/build.gradle.tmp app/build.gradle

          echo "✅ 签名配置完成"

      # ========== 9. 打包 Release APK ==========
      - name: Build Release APK
        working-directory: ../taro-native-shell/android
        run: |
          printf '\n' >> gradle.properties
          cat >> gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          PROPS

          chmod +x gradlew

          # init.gradle 注入 kotlinVersion
          cat > /tmp/init.gradle << 'INIT'
          gradle.projectsLoaded { g ->
            g.rootProject.ext.kotlinVersion = "1.9.23"
          }
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('kotlinVersion')) {
                project.ext.kotlinVersion = "1.9.23"
              }
            }
          }
          INIT

          # Gradle 注入签名信息 + 版本号
          set -o pipefail
          ./gradlew assembleRelease \
            -I /tmp/init.gradle \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -Pandroid.injected.version.code="${{ inputs.version_code || '100000' }}" \
            -Pandroid.injected.version.name="${{ inputs.version_name || '1.0.0' }}" \
            --stacktrace 2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo ""
            echo "========== 构建失败，最后 150 行日志 =========="
            tail -150 /tmp/gradle.log
            echo "========== 错误详情 =========="
            grep -E '^(e:|w:)' /tmp/gradle.log | head -80 || true
            exit $GRADLE_EXIT
          fi

      # ========== 10. 上传 APK ==========
      - name: Copy APK to workspace
        run: |
          mkdir -p artifacts
          APK_PATH="../taro-native-shell/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" artifacts/
            echo "✅ APK 已复制到 artifacts/"
            ls -lh artifacts/
          else
            echo "❌ APK 不存在: $APK_PATH"
            echo "查找所有 APK 文件..."
            find ../taro-native-shell -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Release-APK
          path: artifacts/app-release.apk
          retention-days: 30

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ApexFinance ${{ inputs.version_name || '1.0.0' }}
          body: ${{ inputs.release_notes }}
          files: |
            artifacts/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
